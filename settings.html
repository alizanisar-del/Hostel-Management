<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | LuxeStay HMS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <a href="../index.html" class="sidebar-logo">
                <i class="fas fa-hotel"></i>
                <span>LuxeStay HMS</span>
            </a>
        </div>
        <div class="nav flex-column">
            <a href="../index.html" class="nav-link">
                <i class="fas fa-th-large"></i> Dashboard
            </a>
            <a href="rooms.html" class="nav-link">
                <i class="fas fa-door-open"></i> Room Management
            </a>
            <a href="bookings.html" class="nav-link">
                <i class="fas fa-calendar-check"></i> Bookings
            </a>
            <a href="check-in-out.html" class="nav-link">
                <i class="fas fa-key"></i> Check-in / Out
            </a>
            <a href="guests.html" class="nav-link">
                <i class="fas fa-users"></i> Guests
            </a>
            <a href="payments.html" class="nav-link">
                <i class="fas fa-credit-card"></i> Payments
            </a>
            <a href="reports.html" class="nav-link">
                <i class="fas fa-chart-line"></i> Reports
            </a>
            <a href="settings.html" class="nav-link active">
                <i class="fas fa-cog"></i> Settings
            </a>
            <a href="../logout.html" class="nav-link mt-5">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
        <div class="top-navbar">
            <div class="d-flex align-items-center">
                <button class="btn d-lg-none me-3" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
                        <li class="breadcrumb-item active">Settings</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-8">
                    <div class="table-card p-4">
                        <h5 class="mb-4">System Settings</h5>
                        <form>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Hotel Name</label>
                                    <input type="text" class="form-control" value="LuxeStay Management">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Contact Email</label>
                                    <input type="email" class="form-control" value="contact@luxestay.com">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Currency Symbol</label>
                                <select class="form-select w-25">
                                    <option>$ (USD)</option>
                                    <option>€ (EUR)</option>
                                    <option>£ (GBP)</option>
                                </select>
                            </div>
                            <hr class="my-4">
                            <h5 class="mb-4">Admin Security</h5>
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-control" placeholder="••••••••">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" placeholder="••••••••">
                            </div>
                            <button type="button" class="btn btn-primary mt-3">Save Changes</button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="table-card p-4">
                        <h5 class="mb-4">Profile Picture</h5>
                        <div class="text-center">
                            <img src="https://ui-avatars.com/api/?name=Admin&size=150"
                                class="rounded-circle mb-3 border p-1">
                            <div>
                                <button class="btn btn-sm btn-outline-primary">Change Photo</button>
                                <button class="btn btn-sm btn-outline-danger ms-2">Remove</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/buttons.js"></script>
</body>

</html>
